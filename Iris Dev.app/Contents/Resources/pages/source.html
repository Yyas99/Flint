<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source</title>
<style>
/*THEME*/
:root{--lh:19px;--gw:4ch;--k-tag:#8fb0f7;--k-attr:#b9a2f4;--k-str:#93dccf;--k-num:#a9d9a0;--k-fn:#86ccf2}
@media (prefers-color-scheme: light){:root{--k-tag:#2b57c4;--k-attr:#7044cc;--k-str:#0d766a;--k-num:#3b7631;--k-fn:#1a6aa0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
header{flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px 11px 18px;border-bottom:1px solid var(--line)}
.who{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:4px;margin-right:6px}
.who b{font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b span{color:var(--faint);font-weight:400}
.meta{font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.meta em{font-style:normal;color:var(--dim)}
.seg{display:flex;background:var(--pill);border:1px solid var(--border);border-radius:999px;padding:2px;flex:none}
.seg button{border:0;background:none;height:24px;padding:0 12px;border-radius:999px;color:var(--dim);cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--active);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.seg button:disabled{opacity:.35;cursor:default}
.tg{height:30px;min-width:30px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--pill);border-radius:999px;color:var(--dim);cursor:pointer;flex:none;font-size:12.5px;transition:background .15s,color .15s,border-color .15s}
.tg.ic{padding:0;width:30px}
.tg:hover{background:var(--hover);color:var(--text)}
.tg.on{color:var(--text);border-color:color-mix(in srgb,var(--pick) 60%,transparent);background:color-mix(in srgb,var(--pick) 12%,var(--pill))}
.tg:disabled{opacity:.35;cursor:default}
.tg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.find{position:relative;flex:0 1 230px;min-width:120px;display:block}
.find input{width:100%;height:30px;border-radius:999px;border:1px solid var(--border);background:var(--pill);color:var(--text);padding:0 58px 0 30px;font:inherit;font-size:12.5px;outline:none}
.find input:focus{border-color:color-mix(in srgb,var(--pick) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--pick) 18%,transparent)}
.find svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round}
.find .n{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:10.5px ui-monospace,Menlo,monospace;color:var(--faint);pointer-events:none}
main{position:relative;flex:1;min-height:0;display:flex}
#code{position:relative;flex:1;overflow:auto;font:12px/var(--lh) ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2;-moz-tab-size:2;padding:8px 0 48px;outline:none;font-variant-ligatures:none;scrollbar-gutter:stable}
#in{display:inline-block;min-width:100%}
body.wrap #in{display:block}
.l{display:flex;min-height:var(--lh)}
.l>i{flex:none;width:calc(var(--gw) + 30px);padding:0 16px 0 12px;text-align:right;color:var(--faint);opacity:.6;font-style:normal;user-select:none;-webkit-user-select:none;position:sticky;left:0;background:var(--bg);cursor:pointer;z-index:1}
.l>i::before{content:attr(data-n)}
.l:hover>i{opacity:1}
.l .c{white-space:pre;padding-right:32px;min-width:0}
body.wrap .l .c{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.l.sel{background:color-mix(in srgb,var(--pick) 13%,transparent)}
.l.sel>i{background:color-mix(in srgb,var(--pick) 13%,var(--bg));color:var(--text);opacity:1}
.ktg,.ksl{color:var(--k-tag)}
.kan{color:var(--k-attr)}
.kst,.kre{color:var(--k-str)}
.kkw{color:var(--text);font-weight:600}
.kli,.knu{color:var(--k-num)}
.kfn{color:var(--k-fn)}
.kcm{color:var(--faint);font-style:italic}
.kpu{color:var(--dim)}
.kdt{color:var(--faint)}
a.lk{text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 30%,transparent);text-underline-offset:2px;cursor:pointer}
a.lk:hover{text-decoration-color:currentColor}
::highlight(hit){background-color:color-mix(in srgb,var(--pick) 30%,transparent)}
::highlight(cur){background-color:var(--pick);color:var(--onpick)}
.state{position:absolute;inset:0;display:none;place-items:center;color:var(--dim);background:var(--bg);z-index:3}
.state.show{display:grid}
.state .box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:420px;padding:20px}
.state .sp{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--pick);border-radius:50%;animation:spin .8s linear infinite}
.state p{margin:0;line-height:1.5}
.state small{color:var(--faint)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){.tg .lb{display:none}.tg:not(.ic){padding:0;width:30px}}
</style>
</head>
<body>
<header>
  <div class="who"><b id="ttl">Source</b><div class="meta" id="meta">&nbsp;</div></div>
  <div class="seg" id="seg">
    <button data-m="sent" title="What the server sent">Sent</button>
    <button data-m="live" title="The page as it stands now, after its scripts ran">Live</button>
  </div>
  <button class="tg" id="fmt" title="Format — lay minified code out to read (⌥⌘F)"><svg viewBox="0 0 24 24"><path d="M8 4C6 4 6 5.5 6 7v2.2c0 1-.8 2-2 2.3 1.2.3 2 1.3 2 2.3V17c0 1.5 0 3 2 3M16 4c2 0 2 1.5 2 3v2.2c0 1 .8 2 2 2.3-1.2.3-2 1.3-2 2.3V17c0 1.5 0 3-2 3"/></svg><span class="lb">Format</span></button>
  <button class="tg" id="wrp" title="Wrap long lines (⌥Z)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h12.5a3.5 3.5 0 0 1 0 7H12m2.5-2.5L12 19l2.5 2.5M4 18h4"/></svg><span class="lb">Wrap</span></button>
  <label class="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q" placeholder="Find  ·  :line" spellcheck="false" autocomplete="off"><span class="n" id="qn"></span></label>
  <button class="tg ic" id="cpy" title="Copy all"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg></button>
  <button class="tg ic" id="sav" title="Save as a file"><svg viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14"/></svg></button>
</header>
<main>
  <div id="code" tabindex="0"><div id="in"></div></div>
  <div class="state show" id="st"><div class="box"><div class="sp"></div></div></div>
</main>

    meta: [String(r.status || 'Sent'), (r.type || '').split(';')[0], kb(r.bytes || 0) + (r.truncated ? ' (first 12 MB)' : ''), r.ms != null ? r.ms + ' ms' : '']};
}

async function show() {
  for (const b of $('seg').children) { b.classList.toggle('on', b.dataset.m === mode); b.disabled = b.dataset.m === 'live' && !SNAP; }
  const m = mode;
  if (!loaded[m]) status('busy');
  const d = await fetchMode(m);
  if (m !== mode) return;
  if (d.error) { status('msg', d.error, d.sub); setMeta([]); clearView(); return; }
  if (d.binary) { status('msg', 'This is a ' + (d.type || 'binary') + ' file, not text.', '', ['Open it', () => call('open', {url: d.url, how: 'tab'})]); setMeta([d.type]); clearView(); return; }
  if (pretty[m] === undefined) pretty[m] = d.lang !== 'text' && looksMinified(d.text);
  $('fmt').classList.toggle('on', !!pretty[m]); $('fmt').disabled = d.lang === 'text';
  const key = m + '|' + !!pretty[m];
  let r = results.get(key);
  if (!r) {
    status('busy', pretty[m] && d.text.length > 400000 ? 'Formatting ' + kb(d.text.length) + '…' : '');
    r = await runJob({text: d.text, lang: d.lang, pretty: !!pretty[m], base: d.base});
    results.set(key, r);
  }
  if (key !== mode + '|' + !!pretty[mode]) return;   // you switched while it worked
  const keep = null;
  view = r; viewKey = key; lowered = null;
  setMeta([...d.meta, r.plain.length.toLocaleString() + (r.plain.length === 1 ? ' line' : ' lines')]);
  status('');
  render(keep);
  const q = $('q').value; if (q) search(q, true);
}

function clearView() { if (watcher) watcher.disconnect(); $('in').textContent = ''; chunks = []; filled = new Set(); view = null; viewKey = ''; hits = []; current = -1; counter(); paint(); }

// ——— rendering: lines arrive in blocks of 200 as they come near the screen ———
function measure() {
  const s = document.createElement('span'); s.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:12px ui-monospace,SFMono-Regular,Menlo,monospace';
  s.textContent = 'x'.repeat(100); $('code').appendChild(s); charW = s.getBoundingClientRect().width / 100 || 7.2; s.remove();
}
function estimate(c) {
  const a = c * CH, b = Math.min(view.plain.length, a + CH);
  if (!wrap) return (b - a) * LH;
  const gutter = (String(view.plain.length).length) * charW + 30;
  const per = Math.max(20, Math.floor(($('code').clientWidth - gutter - 34) / charW));
  let rows = 0; for (let i = a; i < b; i++) rows += Math.max(1, Math.ceil(view.plain[i].length / per));
  return rows * LH;
}
function render(keep) {
  if (watcher) watcher.disconnect();
  const box = $('in'); box.textContent = '';
  chunks = []; filled = new Set();
  if (!view) return;
  document.documentElement.style.setProperty('--gw', String(view.plain.length).length + 'ch');
  measure();
  const frag = document.createDocumentFragment();
  for (let c = 0; c * CH < view.plain.length; c++) {
    const d = document.createElement('div'); d.dataset.c = c; d.style.height = estimate(c) + 'px';
    chunks.push(d); frag.appendChild(d);
  }
  box.appendChild(frag);
  watcher = new IntersectionObserver(es => {
    for (const e of es) { const c = +e.target.dataset.c; if (e.isIntersecting) fill(c); else empty(c); }
    paint();
  }, {root: $('code'), rootMargin: '1600px 0px'});
  chunks.forEach(d => watcher.observe(d));
  const hash = /^#L(\d+)$/.exec(location.hash);
  if (keep == null && hash) { selLine = Math.min(view.plain.length, +hash[1]) - 1; reveal(selLine, 'center'); }
  else if (keep > 0) reveal(keep, 'start');
  else $('code').scrollTop = 0;
}
function fill(c) {
  if (filled.has(c) || !view) return;
  const a = c * CH, b = Math.min(view.plain.length, a + CH);
  let h = '';
  for (let i = a; i < b; i++) h += '<div class="l' + (i === selLine ? ' sel' : '') + '" id="L' + (i + 1) + '"><i data-n="' + (i + 1) + '"></i><span class="c">' + view.lines[i] + '</span></div>';
  const d = chunks[c]; d.innerHTML = h; d.style.height = ''; filled.add(c);
}
function empty(c) {
  if (!filled.has(c)) return;
  const d = chunks[c]; d.style.height = d.offsetHeight + 'px'; d.textContent = ''; filled.delete(c);
}
function reveal(i, block) {
  if (!view || i < 0) return;
  fill(Math.floor(i / CH));
  const el = document.getElementById('L' + (i + 1)); if (!el) return;
  const code = $('code');
  const y = el.offsetTop - (block === 'start' ? 8 : code.clientHeight / 2 - LH / 2);
  code.scrollTop = Math.max(0, y);
  // the blocks around it fill as the observer catches up; make sure the line's own block is painted now
  paint();
}
function topLine() {
  if (!view || !chunks.length) return 0;
  const y = $('code').scrollTop;
  let lo = 0, hi = chunks.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (chunks[mid].offsetTop <= y) lo = mid; else hi = mid - 1; }
  const d = chunks[lo]; const a = lo * CH;
  if (!filled.has(lo)) return a + Math.max(0, Math.floor((y - d.offsetTop) / LH));
  for (const el of d.children) if (el.offsetTop + el.offsetHeight > y) return +el.id.slice(1) - 1;
  return a;
}

// ——— find: every match in the whole file, painted with highlights so the colours stay ———
function search(q, keepPlace) {
  hits = []; current = -1;
  if (!view || !q) { counter(); paint(); return; }
  const jump = /^:(\d+)$/.exec(q.trim());
  if (jump) { const ln = Math.min(view.plain.length, Math.max(1, +jump[1])) - 1; select(ln); reveal(ln, 'center'); counter(); paint(); return; }
  if (!lowered) lowered = view.plain.map(s => { const l = s.toLowerCase(); return l.length === s.length ? l : s; });
  const ql = q.toLowerCase(); const L = ql.length;
  for (let i = 0; i < lowered.length && hits.length < 200000; i++) {
    const s = lowered[i]; let p = s.indexOf(ql);
    while (p >= 0) { hits.push(i, p); p = s.indexOf(ql, p + L); }
  }
  const n = hits.length / 2;
  if (n) {
    const from = topLine(); current = 0;
    for (let k = 0; k < n; k++) if (hits[2 * k] >= from) { current = k; break; }
    if (!keepPlace || !lineVisible(hits[2 * current])) reveal(hits[2 * current], 'center');
  }
  counter(); paint();
}
function lineVisible(i) {
  const el = document.getElementById('L' + (i + 1)); if (!el) return false;
  const code = $('code'); return el.offsetTop >= code.scrollTop && el.offsetTop + LH <= code.scrollTop + code.clientHeight;
}
function step(d) {
  const n = hits.length / 2; if (!n) return;
  current = (current + d + n) % n; reveal(hits[2 * current], 'center'); counter(); paint();
}
function counter() {
  const n = hits.length / 2, q = $('q').value;
  $('qn').textContent = !q || /^:\d+$/.test(q.trim()) ? '' : n ? (current + 1).toLocaleString() + '/' + n.toLocaleString() + (n >= 200000 ? '+' : '') : '0';
}
function rangeAt(i, col, len) {
  const el = document.getElementById('L' + (i + 1)); if (!el) return null;
  const w = document.createTreeWalker(el.lastChild, NodeFilter.SHOW_TEXT);
  let pos = 0, sN = null, sO = 0, node;
  while ((node = w.nextNode())) {
    const l = node.data.length;
    if (!sN && col < pos + l) { sN = node; sO = col - pos; }
    if (sN && col + len <= pos + l) { const r = new Range(); r.setStart(sN, sO); r.setEnd(node, col + len - pos); return r; }
    pos += l;
  }
  return null;
}
function paint() {
  if (!window.CSS || !CSS.highlights || typeof Highlight === 'undefined') return;
  const L = $('q').value.length, n = hits.length / 2;
  const all = [], cur = [];
  if (n && L) for (const c of filled) {
    const a = c * CH, b = a + CH;
    let lo = 0, hi = n; while (lo < hi) { const mid = (lo + hi) >> 1; if (hits[2 * mid] < a) lo = mid + 1; else hi = mid; }
    for (let k = lo; k < n && hits[2 * k] < b && all.length < 8000; k++) { const r = rangeAt(hits[2 * k], hits[2 * k + 1], L); if (r) (k === current ? cur : all).push(r); }
  }
  CSS.highlights.set('hit', new Highlight(...all));
  CSS.highlights.set('cur', new Highlight(...cur));
}

function select(i) {
  const old = document.querySelector('.l.sel'); if (old) old.classList.remove('sel');
  selLine = i;
  const el = document.getElementById('L' + (i + 1)); if (el) el.classList.add('sel');
  try { history.replaceState(null, '', '#L' + (i + 1)); } catch (e) {}
}

// ——— controls ———
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled || b.dataset.m === mode) return;
  mode = b.dataset.m; setPref('mode', mode); show();
});
function toggleFormat() { if ($('fmt').disabled || !loaded[mode] || loaded[mode].error || loaded[mode].binary) return; pretty[mode] = !pretty[mode]; show(); }
function toggleWrap() {
  const keep = topLine();
  wrap = !wrap; setPref('wrap', wrap);
  document.body.classList.toggle('wrap', wrap); $('wrp').classList.toggle('on', wrap);
  if (view) { render(keep); paint(); }
}
$('fmt').onclick = toggleFormat;
$('wrp').onclick = toggleWrap;
$('cpy').onclick = () => { if (view) call('copy', {text: view.plain.join('\n')}).then(() => call('toast', {text: 'Copied ' + view.plain.length.toLocaleString() + ' lines'})); };
$('sav').onclick = () => {
  if (!view) return;
  const d = loaded[mode] || {};
  let name = (path.split('?')[0].split('/').pop() || host || 'source').replace(/[^\w.\-]+/g, '-');
  const ext = {html: 'html', xml: 'xml', js: 'js', css: 'css', json: 'json'}[d.lang] || 'txt';
  if (!/\.\w{1,6}$/.test(name)) name += '.' + ext;
  if (mode === 'live') name = name.replace(/(\.\w+)$/, '-live$1');
  call('source.save', {text: view.plain.join('\n'), name});
};
let typing = null;
$('q').addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(() => search($('q').value, false), 140); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(typing); if (!hits.length) search($('q').value, false); else step(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape') { e.preventDefault(); $('q').value = ''; search('', false); $('code').focus(); }
});
window.irisFind = () => { $('q').focus(); $('q').select(); };
addEventListener('keydown', e => {
  const inField = document.activeElement === $('q');
  if (e.metaKey && !e.altKey && e.key.toLowerCase() === 'f') { e.preventDefault(); window.irisFind(); }
  else if (e.metaKey && e.key.toLowerCase() === 'g') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
  else if (e.metaKey && e.altKey && e.code === 'KeyF') { e.preventDefault(); toggleFormat(); }
  else if (e.altKey && !e.metaKey && e.code === 'KeyZ') { e.preventDefault(); toggleWrap(); }
  else if (!inField && e.key === '/' && !e.metaKey) { e.preventDefault(); window.irisFind(); }
});
$('code').addEventListener('click', e => {
  const num = e.target.closest('.l>i');
  if (num) { select(+num.dataset.n - 1); return; }
  const a = e.target.closest('a.lk'); if (!a) return;
  e.preventDefault();
  const u = 'iris://source?u=' + encodeURIComponent(a.dataset.u);
  if (e.metaKey) call('open', {url: u, how: 'tab'}); else location.href = u;
});
let resizeT = null;
addEventListener('resize', () => { if (!wrap || !view) return; clearTimeout(resizeT); resizeT = setTimeout(() => { const k = topLine(); render(k); paint(); }, 200); });

if (!TARGET) status('msg', 'Nothing to show.', 'Open View Source from a web page.');
else show();

</script>
</body>
</html>
